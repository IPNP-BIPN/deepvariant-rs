[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# Le numero suit l'oracle : 1.10.x vise DeepVariant 1.10.0. 0.x tant que make_examples n'est pas
# octet-identique.
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "BSD-3-Clause"
authors = ["Benjamin Demaille <benjamin.demaille@icloud.com>"]
repository = "https://github.com/IPNP-BIPN/deepvariant-rs"

[workspace.lints.clippy]

[profile.release]
lto = "thin"
codegen-units = 1
